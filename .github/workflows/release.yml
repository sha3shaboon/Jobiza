# Publishes a GitHub release: builds and smoke-tests the Windows and Android apps,
# then attaches them. Runs when a version tag is pushed (e.g. v0.1.0), or by hand
# from the Actions tab with a version number (the tag is then created here).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (must match desktop/ and mobile/package.json)"
        required: true

permissions:
  contents: read

jobs:
  windows:
    uses: ./.github/workflows/desktop.yml
    secrets: inherit

  android:
    uses: ./.github/workflows/android.yml
    secrets: inherit

  publish:
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', inputs.version) }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app versions
        run: |
          for f in desktop/package.json mobile/package.json; do
            v=$(node -p "require('./$f').version")
            if [ "v$v" != "$TAG" ]; then echo "$f is version $v, but the release is $TAG"; exit 1; fi
          done

      - uses: actions/download-artifact@v4
        with:
          name: Jobiza-Windows-installer
          path: release

      - uses: actions/download-artifact@v4
        with:
          name: Jobiza-Android-phone-arm64
          path: release

      - name: Checksums
        working-directory: release
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/${TAG}.md"
          [ -f "$notes" ] || notes=/dev/null
          # A pushed tag is used as is; a run by hand creates the tag on this commit.
          gh release create "$TAG" release/* \
            --title "Jobiza ${TAG#v}" \
            --notes-file "$notes" \
            --prerelease \
            --target "$GITHUB_SHA"
