# Builds the Android app (one APK per chip type) and smoke-tests it on an emulator.
name: Android app

on:
  workflow_dispatch:
  # The release workflow runs this too (see release.yml).
  workflow_call:
  push:
    # Branches only: a version tag runs the release workflow instead.
    branches: ["**"]
    paths:
      - "mobile/**"
      - "src/**"
      - "drizzle/**"
      - "public/**"
      - "desktop/server-entry.cjs"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install app dependencies
        run: npm ci

      - name: Build the app
        run: npm run build

      - name: Install mobile tooling
        working-directory: mobile
        run: |
          npm ci
          pip install patchelf

      - name: Prepare the server, Node runtime and assets
        working-directory: mobile
        run: |
          npm run prepare-server
          npm run prepare-runtime
          npm run prepare-assets
          npx cap sync android

      - name: Build the APKs
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      # With a signing key in the repository secrets, also build the release APK, so
      # installs can be updated by later releases. See README → Android app → Signing.
      - name: Build the signed release APK
        if: ${{ env.HAS_KEY == 'true' }}
        working-directory: mobile/android
        env:
          JOBIZA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          JOBIZA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          JOBIZA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/jobiza.keystore"
          JOBIZA_KEYSTORE="$RUNNER_TEMP/jobiza.keystore" ./gradlew assembleRelease --no-daemon
          rm "$RUNNER_TEMP/jobiza.keystore"

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disk-size: 4G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash mobile/scripts/emulator-smoke.sh mobile/android/app/build/outputs/apk/debug/app-x86_64-debug.apk smoke

      - name: Pick the phone APK
        run: |
          mkdir -p mobile/out
          version=$(node -p "require('./mobile/package.json').version")
          if [ -f mobile/android/app/build/outputs/apk/release/app-arm64-v8a-release.apk ]; then
            cp mobile/android/app/build/outputs/apk/release/app-arm64-v8a-release.apk "mobile/out/Jobiza-$version-android-arm64.apk"
          else
            cp mobile/android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk "mobile/out/Jobiza-$version-android-arm64-debug.apk"
          fi
          ls -la mobile/out

      - name: Upload the phone APK
        uses: actions/upload-artifact@v4
        with:
          name: Jobiza-Android-phone-arm64
          path: mobile/out/*.apk
          retention-days: 30

      - name: Upload smoke-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-test
          path: smoke/
          if-no-files-found: ignore
