# Full local stack:  cp .env.example .env && npm run gen:secrets  (paste into .env), then
#   docker compose up --build
# App: http://localhost:3000   ·   Mailpit (catches all emails): http://localhost:8025

x-app-env: &app-env
  DATABASE_URL: postgres://jobiza:jobiza@postgres:5432/jobiza
  REDIS_URL: redis://redis:6379
  SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: jobiza
      POSTGRES_PASSWORD: jobiza
      POSTGRES_DB: jobiza
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobiza -d jobiza"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]

  migrate:
    build: { context: ., target: tools }
    env_file: [.env]
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  web:
    build: { context: ., target: web }
    env_file: [.env]
    environment: *app-env
    ports: ["3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped

  worker:
    build: { context: ., target: worker }
    env_file: [.env]
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
