<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-label="Illustration: a shelf of research tools: books, a highlighter, a magnifying glass over a highlighted, cited line of text, a paper and a potted mallow plant in bloom">
  <defs>
    <!-- grain: speckled print texture over flat colour -->
    <filter id="grain" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.09  0 0 0 0 0.16  0 0 0 0 0.11  0 0 0 -3.4 1.42" result="specks"/>
      <feComposite in="specks" in2="SourceGraphic" operator="in" result="clipped"/>
      <feBlend in="SourceGraphic" in2="clipped" mode="multiply"/>
    </filter>
    <!-- hand-cut edges -->
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="11" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <path id="petal" d="M50 50C43 46 33 33 37 20C39.5 12 47 11 50 18C53 11 60.5 12 63 20C67 33 57 46 50 50Z"/>
    <g id="blossom"><use href="#petal"/><use href="#petal" transform="rotate(72 50 50)"/><use href="#petal" transform="rotate(144 50 50)"/><use href="#petal" transform="rotate(216 50 50)"/><use href="#petal" transform="rotate(288 50 50)"/><circle cx="50" cy="50" r="7" fill="#f6e7a8"/></g>
  </defs>


  <!-- doodles: loose, hand-drawn, filling the arch -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#rough)">
    <!-- big loops and squiggles -->
    <path d="M96 352c26-58 78-44 96-12s-8 64-44 52 2-74 62-90 78 30 112 6" stroke="#f3b6ce" stroke-width="5"/>
    <path d="M664 116c30 36 62-26 96 2s48 46 92 12c26-20 44-6 52 10" stroke="#f3b6ce" stroke-width="5"/>
    <path d="M206 214c14 24 40 24 54 0s40-24 54 0 40 24 54 0" stroke="#9fc7a6" stroke-width="5"/>
    <path d="M792 470c22-30 52 18 80-12s46 6 66-8" stroke="#9fc7a6" stroke-width="5"/>
    <path d="M318 548c18-20 40 14 60-4s38 10 56-6" stroke="#f1eee4" stroke-width="4" opacity=".7"/>
    <!-- spiral -->
    <path d="M300 128c0-8 8-12 14-8s6 16-4 20-22-4-22-18 14-26 30-22 26 18 20 32" stroke="#f6e7a8" stroke-width="4.5"/>
    <!-- zigzag -->
    <path d="M846 396l14-16 14 16 14-16 14 16 14-16" stroke="#f6e7a8" stroke-width="4.5"/>
    <!-- asterisk -->
    <path d="M454 150v36M436 160l36 16M436 176l36-16" stroke="#f1eee4" stroke-width="5"/>
    <!-- big quote marks -->
    <path d="M500 96c0-16 10-26 24-28M532 96c0-16 10-26 24-28" stroke="#f6e7a8" stroke-width="7"/>
    <!-- outlined shapes -->
    <path d="M336 214l20 34h-40z" stroke="#f1eee4" stroke-width="4"/>
    <path d="M884 250l15 26h-30z" stroke="#f1eee4" stroke-width="4"/>
    <path d="M150 230l14 24h-28z" stroke="#f3b6ce" stroke-width="4"/>
    <rect x="118" y="404" width="34" height="18" rx="3" transform="rotate(-18 135 413)" stroke="#f1eee4" stroke-width="4"/>
    <rect x="600" y="104" width="30" height="16" rx="3" transform="rotate(24 615 112)" stroke="#f1eee4" stroke-width="4"/>
    <circle cx="790" cy="432" r="13" stroke="#f3b6ce" stroke-width="4"/>
    <circle cx="244" cy="292" r="10" stroke="#f6e7a8" stroke-width="4"/>
    <path d="M394 116v22M383 127h22" stroke="#9fc7a6" stroke-width="4.5"/>
    <path d="M926 470v20M916 480h20" stroke="#f1eee4" stroke-width="4"/>
    <!-- dashed arrow: from the highlighted paper back to the magnifier -->
    <path d="M868 196c-20-46-80-58-110-32" stroke="#f1eee4" stroke-width="3.5" stroke-dasharray="2 9" opacity=".85"/>
    <path d="M770 152l-14 12 18 4" stroke="#f1eee4" stroke-width="3.5"/>
  </g>
  <!-- little leaves -->
  <g filter="url(#grain)" stroke="#16291d" stroke-width="2.5" stroke-linejoin="round">
    <path d="M92 458c-6-26 10-44 36-46-2 26-16 44-36 46z" fill="#9fc7a6"/>
    <path d="M92 458c10-16 22-28 34-44" fill="none"/>
    <path d="M900 444c22-14 44-8 54 14-24 8-44 4-54-14z" fill="#7fb08a"/>
    <path d="M900 444c18 6 34 10 52 14" fill="none"/>
    <path d="M424 268c-4-20 8-34 28-36-2 20-12 34-28 36z" fill="#9fc7a6"/>
  </g>
  <!-- confetti -->
  <g filter="url(#grain)">
    <circle cx="410" cy="196" r="12" fill="#e8604c"/>
    <circle cx="570" cy="86" r="14" fill="#9fc7a6"/>
    <circle cx="196" cy="160" r="10" fill="#f6e7a8"/>
    <circle cx="210" cy="372" r="9" fill="#f6e7a8"/>
    <circle cx="912" cy="372" r="12" fill="#f3b6ce"/>
    <circle cx="764" cy="410" r="8" fill="#e8604c"/>
    <circle cx="92" cy="528" r="11" fill="#3a3bb3"/>
    <circle cx="616" cy="470" r="9" fill="#3a3bb3"/>
    <circle cx="470" cy="232" r="7" fill="#f3b6ce"/>
    <circle cx="840" cy="530" r="10" fill="#f6e7a8"/>
  </g>
  <!-- stray blossoms -->
  <g filter="url(#grain)" fill="#f3b6ce" stroke="#16291d" stroke-width="3">
    <use href="#blossom" transform="translate(116 274) scale(.4)"/>
    <use href="#blossom" transform="translate(872 488) scale(.32)"/>
    <use href="#blossom" transform="translate(436 380) scale(.3)"/>
  </g>

  <!-- shelves -->
  <g filter="url(#rough)" fill="#f2c94c" stroke="#16291d" stroke-width="3">
    <rect x="110" y="468" width="330" height="11" rx="2"/>
    <rect x="610" y="330" width="300" height="11" rx="2"/>
    <rect x="300" y="520" width="470" height="11" rx="2"/>
  </g>

  <!-- ===== left shelf: book stack ===== -->
  <g filter="url(#rough)">
    <g filter="url(#grain)" stroke="#16291d" stroke-width="3" stroke-linejoin="round">
      <rect x="140" y="420" width="190" height="48" rx="5" fill="#f3b6ce"/>
      <rect x="158" y="380" width="160" height="40" rx="5" fill="#f1eee4"/>
      <rect x="170" y="346" width="138" height="34" rx="5" fill="#9fc7a6"/>
      <rect x="160" y="316" width="122" height="30" rx="5" fill="#f2c94c" transform="rotate(-4 220 331)"/>
    </g>
    <g stroke="#16291d" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M156 428v32M314 428v32M174 388v24M302 388v24M186 352v22M292 352v22"/>
    </g>
  </g>

  <!-- highlighter standing on the left shelf -->
  <g filter="url(#rough)">
    <g filter="url(#grain)" stroke="#16291d" stroke-width="3" stroke-linejoin="round">
      <path d="M368 468v-138q0-14 14-14h20q14 0 14 14v138z" fill="#f2c94c"/>
      <path d="M372 316v-40q0-12 12-12h16q12 0 12 12v40z" fill="#e8604c"/>
      <rect x="376" y="250" width="32" height="16" rx="5" fill="#e8604c"/>
    </g>
    <path d="M380 420h28M380 434h28" stroke="#16291d" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- ===== centre: magnifying glass over a highlighted, cited line ===== -->
  <g filter="url(#rough)">
    <g filter="url(#grain)" stroke="#16291d" stroke-width="3" stroke-linejoin="round">
      <path d="M498 520l52-140 28 10-46 132z" fill="#3a3bb3"/>
      <circle cx="590" cy="300" r="96" fill="#f1eee4"/>
      <circle cx="590" cy="300" r="76" fill="#fbf7ee"/>
    </g>
    <clipPath id="lens"><circle cx="590" cy="300" r="74"/></clipPath>
    <g clip-path="url(#lens)" stroke-linecap="round">
      <path d="M528 262h118M528 288h96M528 314h124M528 340h84" stroke="#c9c3b3" stroke-width="9"/>
      <path d="M528 288h96" stroke="#f3b6ce" stroke-width="20" opacity=".85"/>
      <path d="M528 288h96" stroke="#5b616b" stroke-width="9"/>
      <circle cx="640" cy="282" r="9" fill="#b8467a" stroke="#16291d" stroke-width="2.5"/>
    </g>
  </g>

  <!-- mug on the floor shelf -->
  <g filter="url(#rough)">
    <g filter="url(#grain)" stroke="#16291d" stroke-width="3" stroke-linejoin="round">
      <path d="M660 520l-6-62h76l-6 62z" fill="#e8604c"/>
      <path d="M728 470q24 2 20 24t-24 18" fill="none" stroke="#16291d" stroke-width="12"/><path d="M728 470q24 2 20 24t-24 18" fill="none" stroke="#e8604c" stroke-width="6"/>
    </g>
    <path d="M684 430c-10-14 10-18 0-32M704 430c-10-14 10-18 0-32" stroke="#f1eee4" stroke-width="3" fill="none" stroke-linecap="round" opacity=".7"/>
  </g>

  <!-- ===== right shelf: potted khubbayza in bloom ===== -->
  <g filter="url(#rough)">
    <g fill="none" stroke="#16291d" stroke-width="3.5" stroke-linecap="round">
      <path d="M700 268c-2-40-14-70-40-96"/>
      <path d="M712 268c2-50 10-92 34-128"/>
      <path d="M724 268c6-30 26-50 56-60"/>
    </g>
    <g filter="url(#grain)" stroke="#16291d" stroke-width="3">
      <circle cx="668" cy="214" r="26" fill="#9fc7a6"/>
      <circle cx="760" cy="204" r="22" fill="#9fc7a6"/>
      <circle cx="716" cy="182" r="18" fill="#7fb08a"/>
    </g>
    <g stroke="#16291d" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M668 214l-16-12M668 214l2-20M668 214l18-8M760 204l-14-10M760 204l8-16M760 204l16 2"/>
    </g>
    <g filter="url(#grain)" fill="#f3b6ce" stroke="#16291d" stroke-width="2.4">
      <use href="#blossom" transform="translate(624 132) scale(.78)"/>
      <use href="#blossom" transform="translate(706 98) scale(.9)"/>
      <use href="#blossom" transform="translate(756 170) scale(.62)"/>
    </g>
    <g filter="url(#grain)" stroke="#16291d" stroke-width="3" stroke-linejoin="round">
      <path d="M664 330l-10-62h120l-10 62z" fill="#f1eee4"/>
      <rect x="648" y="258" width="132" height="16" rx="4" fill="#f3b6ce"/>
    </g>
  </g>

  <!-- paper with highlighted lines and citation marks -->
  <g filter="url(#rough)" transform="rotate(8 850 270)">
    <rect x="806" y="200" width="88" height="124" rx="4" fill="#fbf7ee" stroke="#16291d" stroke-width="3" filter="url(#grain)"/>
    <g stroke-linecap="round">
      <path d="M820 222h58M820 238h48M820 254h60M820 270h40M820 286h56M820 302h34" stroke="#c9c3b3" stroke-width="4"/>
      <path d="M820 238h48M820 270h40" stroke="#f3b6ce" stroke-width="9" opacity=".75"/>
      <path d="M820 238h48M820 270h40" stroke="#5b616b" stroke-width="3"/>
    </g>
    <circle cx="874" cy="232" r="5" fill="#b8467a"/><circle cx="866" cy="264" r="5" fill="#b8467a"/>
  </g>
</svg>
